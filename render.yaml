services:
  - type: web
    name: tvo-social
    env: python
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn tvo_social.webapp:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TVO_SOCIAL_PASSWORD
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_USER_ID
        sync: false
