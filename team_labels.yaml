# Per-team display label overrides for the red category badge/pill.
#
# Works for ANY team, not just teams that share a category name - use this
# whenever you want a different label than the raw API category, e.g. to
# shorten a long league name, rename a team, or (the original use case)
# distinguish multiple TVO teams that share one category (jersey colors).
#
# If a team's ID has no entry here, its raw API category (team.category)
# is used unchanged - no override needed for most teams.
#
# Find a team's ID by running `tvo-social refresh-teams`, e.g.:
#   [431471] TV Oberwil BL - Herren Aktive GF 4. Liga
#            ^^^^^^ this is the team_id to use below
#
# Format: team_id: "display label"
# Example (commented out): shorten the Herren league name for the badge:
#   431471: "1. Mannschaft Herren"

430043: "D Rot"
428478: "D Weiss"
430201: "D Blau"
429806: "E Rot"
432099: "E Weiss"
432604: "E Blau"

